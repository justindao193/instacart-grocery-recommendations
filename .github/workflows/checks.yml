name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reference-and-evidence:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check reference rules and published evidence
        run: python -m unittest discover -s tests -v
      - name: Run the invented example
        run: python run.py demo
      - name: Read saved aggregate results
        run: python run.py results
